apiVersion: batch/v1
kind: Job
metadata:
  name: sdlc-eda-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: sdlc-eda-bootstrap
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: sdlc-eda-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          command: ["python3", "/scripts/bootstrap-aap-eda.py"]
          envFrom:
            - configMapRef:
                name: sdlc-cluster-config
          env:
            - name: AAP_CONTROLLER_URL
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: AAP_CONTROLLER_URL
            - name: EDA_PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_PROJECT_NAME
                  optional: true
            - name: EDA_PROJECT_SCM_URL
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_PROJECT_SCM_URL
            - name: EDA_RULEBOOK_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_RULEBOOK_NAME
                  optional: true
            - name: EDA_ACTIVATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_ACTIVATION_NAME
            - name: EDA_DECISION_ENV_NAME
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_DECISION_ENV_NAME
                  optional: true
            - name: EDA_DECISION_ENV_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_DECISION_ENV_IMAGE
                  optional: true
            - name: EDA_ORGANIZATION_ID
              valueFrom:
                configMapKeyRef:
                  name: sdlc-cluster-config
                  key: EDA_ORGANIZATION_ID
                  optional: true
            - name: AAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aap-credentials
                  key: username
            - name: AAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aap-credentials
                  key: password
            - name: TPA_UPLOADER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eda-activation-secrets
                  key: tpa_uploader_password
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eda-activation-secrets
                  key: opencode_server_password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: sdlc-eda-bootstrap-source
            defaultMode: 0555
