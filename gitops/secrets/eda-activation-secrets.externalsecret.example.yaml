apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eda-activation-secrets
  namespace: sdlc-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: eda-activation-secrets
    creationPolicy: Owner
  data:
    - secretKey: tpa_uploader_password
      remoteRef:
        key: sdlc/tpa-uploader
        property: password
    - secretKey: opencode_server_password
      remoteRef:
        key: sdlc/opencode-server
        property: password
