apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencode-server
  namespace: sdlc-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: opencode-server
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: sdlc/opencode-server
        property: password
