apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-credentials
  namespace: sdlc-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: gitlab-credentials
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: sdlc/gitlab
        property: url
    - secretKey: username
      remoteRef:
        key: sdlc/gitlab
        property: username
    - secretKey: password
      remoteRef:
        key: sdlc/gitlab
        property: password
    - secretKey: token
      remoteRef:
        key: sdlc/gitlab
        property: token
        # optional — omit if PAT is derived at runtime
