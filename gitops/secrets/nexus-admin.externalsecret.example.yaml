apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-admin
  namespace: sdlc-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: nexus-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: sdlc/nexus-admin
        property: password
