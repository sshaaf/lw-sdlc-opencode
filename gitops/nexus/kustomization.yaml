apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: lightwell-repositories
    files:
      - lightwell-repositories.json
  - name: nexus-reconcile-source
    files:
      - nexus-reconcile.py

resources:
  - ../base/cluster-config
  - reconcile-job.yaml
