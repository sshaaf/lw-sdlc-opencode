apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sdlc-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/sshaaf/sdlc-opencode.git
    targetRevision: main
    path: gitops/config
  destination:
    server: https://kubernetes.default.svc
    namespace: sdlc-control-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
