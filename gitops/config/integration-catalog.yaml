# Integration inventory — fill gitops/config/cluster-config.yaml (non-secret) and
# cluster Secrets / ExternalSecrets per gitops/secrets/README.md before enabling workloads.
#
# provider: platform | ops | this-repo
# sensitivity: public | internal | secret

apiVersion: sdlc.lightwell/v1
kind: IntegrationCatalog
metadata:
  name: sdlc-remediation-loop
spec:
  namespaces:
    control_plane: sdlc-control-plane
    mcp_servers: sdlc-mcp-servers
    nexus: lightwell-nexus

  platform:
    - id: keycloak
      component: Keycloak SSO
      provider: platform
      used_by: [eda-playbooks, openshift-login]
      config_keys:
        - name: KEYCLOAK_URL
          in_cluster_config: true
        - name: KEYCLOAK_TPA_REALM
          in_cluster_config: true
      secrets: []

    - id: rhtpa
      component: Red Hat Trusted Profile Analyzer
      provider: platform
      used_by: [eda-playbooks]
      config_keys:
        - name: TPA_URL
          in_cluster_config: true
        - name: TPA_OAUTH_CLIENT_ID
          in_cluster_config: true
        - name: TPA_SBOM_LABEL
          in_cluster_config: true
      secrets:
        - secret: tpa-uploader-credentials
          keys: [username, password]
          consumers: [aap-eda-activation]

    - id: aap-eda
      component: Ansible Automation Platform + EDA
      provider: platform
      used_by: [nexus-webhooks, gitlab-webhooks, playbooks]
      config_keys:
        - name: AAP_CONTROLLER_URL
          in_cluster_config: true
          notes: UI/API for operators; rulebooks run on EDA
        - name: EDA_WEBHOOK_URL
          in_cluster_config: true
          notes: In-cluster listener for playbooks + Nexus tpa_results callback
        - name: EDA_WEBHOOK_ROUTE_URL
          in_cluster_config: true
          notes: External HTTPS URL if GitLab/Nexus cannot reach cluster DNS
        - name: EDA_ACTIVATION_NAME
          in_cluster_config: true
      secrets:
        - secret: aap-eda-token
          keys: [token]
          optional: true
          notes: Only if automation talks to Controller API from cluster

    - id: gitlab
      component: GitLab
      provider: platform
      used_by: [opencode, gitlab-mcp, webhooks]
      config_keys:
        - name: GITLAB_URL
          in_cluster_config: true
        - name: REMEDIATION_APP_GITLAB_PATH
          in_cluster_config: true
        - name: GITLAB_WEBHOOK_TARGET_URL
          in_cluster_config: true
          notes: Usually EDA_WEBHOOK_ROUTE_URL or EDA_WEBHOOK_URL
      secrets:
        - secret: gitlab-credentials
          keys: [url, username, password, token]
          consumers: [opencode-deployment]
          notes: token (PAT) optional if derived at runtime

    - id: nexus
      component: Sonatype Nexus
      provider: platform
      used_by: [nexus-reconcile-job, eda-rulebook]
      config_keys:
        - name: NEXUS_URL
          in_cluster_config: true
        - name: NEXUS_NAMESPACE
          in_cluster_config: true
        - name: NEXUS_WEBHOOK_REPOSITORIES
          in_cluster_config: true
      secrets:
        - secret: nexus-admin
          keys: [password]
        - secret: redhat-packages-credentials
          keys: [username, password]
          notes: Lightwell Network service account for proxy repos

    - id: quay
      component: Red Hat Quay
      provider: platform
      used_by: [opencode-image-pull]
      config_keys:
        - name: OPENCODE_IMAGE
          in_cluster_config: true
          notes: From GitHub CI sha tag or platform Quay mirror
      secrets:
        - secret: quay-pull-secret
          keys: [".dockerconfigjson"]
          optional: true
          consumers: [sdlc-control-plane-namespace]

    - id: llm
      component: LLM provider (OpenCode agents)
      provider: ops
      used_by: [opencode]
      config_keys:
        - name: OPENCODE_LLM_PROVIDER
          in_cluster_config: true
          notes: e.g. anthropic, openai — matches opencode provider config
      secrets:
        - secret: opencode-llm
          keys: [api_key]
          consumers: [opencode-deployment]

  this_repo:
    - id: opencode
      config_keys:
        - name: OPENCODE_BASE_URL
          in_cluster_config: true
        - name: OPENCODE_SERVER_USERNAME
          in_cluster_config: true
        - name: GITLAB_MCP_URL
          in_cluster_config: true
      secrets:
        - secret: opencode-server
          keys: [password]

  not_used:
    - JFrog Artifactory
    - Jenkins
