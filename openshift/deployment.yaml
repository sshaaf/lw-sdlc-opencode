# Skeleton Deployment for OpenCode control plane (sdlc-control-plane namespace).
# Replace the image with your Quay coordinates after CI, e.g.:
#   quay.io/sshaaf/sdlc-opencode:sha-<short-git-sha>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: sdlc-control-plane
  labels:
    app: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      containers:
        - name: opencode
          image: quay.io/sshaaf/sdlc-opencode:sha-REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          env:
            - name: OPENCODE_SERVER_USERNAME
              value: opencode
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-server
                  key: password
            - name: GITLAB_URL
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: url
            - name: GITLAB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: username
            - name: GITLAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: password
            # Populated by PAT resolution (init/Job/ESO) — see .opencode/reference/gitlab-credentials.md
            - name: GITLAB_PAT
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: token
                  optional: true
          # Use TCP when OPENCODE_SERVER_PASSWORD is set (/global/health requires basic auth).
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: sdlc-control-plane
  labels:
    app: opencode
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: http
